package: stadeum/pods
version: 0.13.4
description: A cloud machine for each coding job, with your repos cloned and your app running, so agents can run and test it.
job:
  tools: [claim, bash, edit, git, url, bake, release]
requires:
  secrets: [PODS_URL, PODS_TOKEN]
  # `claim` and `git` read the run's token for a repository's host
  # (`secrets.git(url)`): the person's own, for that host alone.
  git: true
# Workflows strut runs on a graph write (strut `plans/package-seams.md` §2,
# stakwork/strut#851), as the person whose run wrote it. A strut from
# before `on:` refuses this key.
on:
  - created: Workspace
    workflow: setup
  - deleted: Workspace
    workflow: drop-images
